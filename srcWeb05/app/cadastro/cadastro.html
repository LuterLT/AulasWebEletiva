<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 mx-auto">
            <form class="d-flex flex-column gap-3 bg-light border rounded-3 p-3">
                <h3 class="text-center">Cadastro</h3>
                <div class="alert alert-warning" role="alert" style="display: none;">
                    <strong>Erro ao Cadastrar</strong> Preencha todos os campos corretamente.
                </div>
                <div>
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="nome" placeholder="Enter nome" name="nome">
                </div>
                <div>
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                </div>
                <div>
                    <label for="pwd" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <div class="row justify-content-center">
                    <div class="col-auto">
                        <a class="" href="login">Login</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
