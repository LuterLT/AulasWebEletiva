<div class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header bg-white py-3">
			<h5 class="mb-0">Pedido</h5>
		</div>
		<div class="card-body">
			<p *ngIf="lista.length === 0">Nenhum item no carrinho.</p>

			<ul class="list-group mb-3" *ngIf="lista.length > 0">
				<li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of lista">
					<span>{{ item.nome }} x {{ item.quantidade }}</span>
					<strong>R$ {{ item.valorTotal | number:'1.2-2' }}</strong>
				</li>
			</ul>

			<div class="d-flex justify-content-between fw-bold mb-3">
				<span>Total</span>
				<span>R$ {{ total | number:'1.2-2' }}</span>
			</div>

			<button class="btn btn-primary w-100" type="button" (click)="confirmarPedido()" [disabled]="lista.length === 0">
				Confirmar pedido
			</button>

			<p class="text-success mt-3 mb-0" *ngIf="mensagem">{{ mensagem }}</p>
		</div>
	</div>
</div>
