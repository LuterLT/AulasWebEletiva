<div class="alert alert-warning" *ngIf="lista.length<=0">
    <strong>Ops!</strong> Nenhum produto encontrado.
</div>
<div class="container">
<div class="row">
    <div class="col-6 col-md-4 col-lg-3 mt-2 mb-4" *ngFor="let obj of lista">
        <div class="card mx-auto cardsVitrine">
            <img src="produtoSemImagem.webp" class="card-img-top" alt="...">
            <div class="card-body d-flex flex-column justify-content-between">
                <h5 class="card-title">{{obj.nome}}</h5>
                <p class="card-text">{{obj.descricao}}</p>
                <button class="btn btn-primary fw-bold" (click)="adicionarCesta(obj)">ADICIONAR AO CARRINHO</button>
            </div>
        </div>
    </div>
</div>  
</div>
