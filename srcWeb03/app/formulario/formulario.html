<link rel="stylesheet" href="formulario.css" />
<div id="campoDoacao">
  <h3>Doação de Sangue</h3>
  <form action="">
    nome: <input type="text" id="txtNome" placeholder="digite seu nome completo" required />
    email: <input type="email" id="txtEmail" required />
    senha: <input type="password" id="txtSenha" required />
    idade: <input type="number" id="txtIdade" min="18" max="65" required />
    peso: <input type="number" id="txtPeso" min="50" max="150" step="0.1" required />
    data: <input type="date" id="data" required /> 
    hora: <input type="time" id="hora" required /> 

    <!-- TIPO SANGUINEO -->

    tipo sanguineo:
    <div>
      <input type="radio" name="tipo" id="opAp" />A+ <input type="radio" name="tipo" id="opBp" />B+
      <input type="radio" name="tipo" id="opOp" />O+
      <input type="radio" name="tipo" id="opABp" />AB+
      <input type="radio" name="tipo" id="opAn" />A- <input type="radio" name="tipo" id="opBn" />B-
      <input type="radio" name="tipo" id="opOn" />O-
      <input type="radio" name="tipo" id="opABn" />AB+
    </div>
    

    Condições: 
    <div>
      <input type="checkbox" id="op6meses" />Doou sangue nos ultimos 6 meses? 
      <input type="checkbox" id="opGravida" />Está gravida?
      <input type="checkbox" id="opAlcool" />Ingeriu alcool nas ultimas 12h? 
      <input type="checkbox" id="opTatoo" />Fez tatuagem nos ultimos 3 meses
    </div>
    
    Unidade: 
    <select id="unidade">
      <option value="">Ipiranga</option>
      <option value="">Mooca</option>
      <option value="">Vila Mariana</option>
    </select>
    
    mensagem: <textarea id="msg" rows="5" cols="30"></textarea>
    telefone:
    <input type="text" id="telefone" pattern="\([0-9]{2,3}\)\s[0-9]{4,5}-[0-9]{4}" required />
    <button>Enviar</button>
  </form>
</div>
