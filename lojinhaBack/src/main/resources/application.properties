spring.application.name=lojinha
server.port=8081

# Conexao com o PostgreSQL (pode ser sobrescrita por variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lojinha}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Flyway cria/atualiza as tabelas; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
